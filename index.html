<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BTC Intel" />
    <meta name="description" content="Live Bitcoin price, on-chain metrics, weekly deep AI analysis, thesis, strategy, headlines, and global adoption — sovereign reserves, public-company treasuries, ETF flows, and holder data on one dashboard. Built by Nati-Crypto in Cincinnati." />
    <meta name="keywords" content="bitcoin dashboard, bitcoin live price, bitcoin education, bitcoin analysis, cincinnati bitcoin, nati-crypto, bitcoin metrics, bitcoin adoption, bitcoin ETF, bitcoin strategy, on-chain data, bitcoin intelligence" />
    <link rel="canonical" href="https://nati-crypto.com/bitcoin" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nati-Crypto" />
    <meta property="og:title" content="Bitcoin Intelligence — Live Dashboard by Nati-Crypto" />
    <meta property="og:description" content="Live Bitcoin price, on-chain metrics, weekly AI analysis, global adoption tracking, and Bitcoin education — all on one dashboard. Built in Cincinnati by Nati-Crypto." />
    <meta property="og:url" content="https://nati-crypto.com/bitcoin" />
    <meta property="og:image" content="https://nati-crypto.com/bitcoin/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bitcoin Intelligence — Live Dashboard by Nati-Crypto" />
    <meta name="twitter:description" content="Live Bitcoin price, on-chain metrics, weekly AI analysis, global adoption tracking, and Bitcoin education. Built in Cincinnati." />
    <meta name="twitter:image" content="https://nati-crypto.com/bitcoin/og-image.png" />

    <title>Bitcoin Intelligence — Nati-Crypto | Live Dashboard, Education &amp; Analysis</title>

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "name": "Bitcoin Intelligence",
          "url": "https://nati-crypto.com/bitcoin",
          "description": "Live Bitcoin dashboard with real-time price, on-chain metrics, weekly AI-powered deep analysis, thesis and strategy frameworks, market headlines, and global adoption tracking including sovereign reserves, corporate treasuries, and ETF flows.",
          "applicationCategory": "FinanceApplication",
          "operatingSystem": "Any",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
          "creator": {
            "@type": "Organization",
            "name": "Nati-Crypto",
            "url": "https://nati-crypto.com",
            "areaServed": {
              "@type": "City",
              "name": "Cincinnati",
              "containedInPlace": { "@type": "State", "name": "Ohio" }
            }
          }
        },
        {
          "@type": "WebSite",
          "name": "Nati-Crypto",
          "url": "https://nati-crypto.com",
          "description": "Cincinnati-based Bitcoin education, analysis, and live market intelligence."
        },
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "Nati-Crypto", "item": "https://nati-crypto.com" },
            { "@type": "ListItem", "position": 2, "name": "Bitcoin Intelligence", "item": "https://nati-crypto.com/bitcoin" }
          ]
        }
      ]
    }
    </script>
    <script>
      // Dark is the canonical theme and we always start there on every page load,
      // regardless of OS preference or anything stored from a previous session.
      // The light option is in-session only and intentionally does not persist.
      document.documentElement.dataset.theme = 'dark';
      document.documentElement.style.colorScheme = 'dark';
      try { localStorage.removeItem('btc-dashboard.theme'); } catch (e) {}
      try { sessionStorage.removeItem('btc-dashboard.theme'); } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23f7931a'/><stop offset='1' stop-color='%23ffb347'/></linearGradient></defs><rect width='64' height='64' rx='19' fill='url(%23g)'/><text x='32' y='46' text-anchor='middle' font-family='Arial,Helvetica,sans-serif' font-weight='900' font-size='44' fill='black'>%E2%82%BF</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    />
    <style>
      :root {
        --boot-bg: #0d0d1a;
        --boot-text: #e6e6e6;
        --boot-muted: #8892b0;
      }
      :root[data-theme="light"] {
        --boot-bg: #e6eaf2;
        --boot-text: #1c2238;
        --boot-muted: #4a5468;
      }
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: var(--boot-bg);
      }
      body {
        font-family: "Outfit", system-ui, sans-serif;
        color: var(--boot-text);
      }
      .boot-fallback {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }
      .boot-fallback__panel {
        max-width: 520px;
      }
      .boot-fallback__mark {
        width: 48px;
        height: 48px;
        margin: 0 auto 16px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f7931a, #ffb347);
        color: #0d0d1a;
        font-size: 24px;
        font-weight: 900;
      }
      .boot-fallback__title {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 800;
      }
      .boot-fallback__copy {
        margin: 0;
        color: var(--boot-muted);
        line-height: 1.6;
      }
      /* Crawler-visible static content (build-injected). Sits below the
         full-viewport loader and is wiped when React mounts into #root, so
         interactive users never see it — but it lives in the raw served HTML
         for bots, AI crawlers, and the no-JavaScript case. */
      .seo-static {
        max-width: 820px;
        margin: 0 auto;
        padding: 40px 24px;
        line-height: 1.6;
        color: var(--boot-text);
      }
      .seo-static table {
        border-collapse: collapse;
        width: 100%;
        margin: 8px 0 16px;
      }
      .seo-static th,
      .seo-static td {
        border: 1px solid var(--boot-muted);
        padding: 4px 8px;
        text-align: left;
        font-size: 14px;
        vertical-align: top;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback" role="status">
        <div class="boot-fallback__panel">
          <div class="boot-fallback__mark" aria-hidden="true">B</div>
          <p class="boot-fallback__title">Loading Bitcoin Intelligence</p>
          <p class="boot-fallback__copy">
            Live price, on-chain metrics, weekly deep AI analysis, thesis, strategy, headlines, and global adoption — all on one dashboard.
            If this message stays on screen, start the app with <code>npm run dev</code>
            while editing, or upload/open the generated <code>dist/index.html</code> file.
          </p>
        </div>
      </div>
      <!-- SEO_STATIC_CONTENT -->
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
